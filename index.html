<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dungeon 10</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="title" class="screen">
    <h1>Dungeon 10</h1>
    <p class="tag">A d10 dice-roll dungeon adventure</p>
    <button id="start" class="big">Tap to begin your quest</button>
    <a class="dl" href="https://github.com/Wut-Lab/Dungeon-10/archive/refs/heads/main.zip">Download the game to play offline</a>
  </section>

  <section id="play" class="screen" hidden>
    <h2 id="dungeon-name"></h2>
    <nav id="nav">
      <button data-menu="inventory" aria-pressed="false">Inventory</button>
      <button data-menu="log" aria-pressed="false">Log</button>
      <button data-menu="options" aria-pressed="false">Options</button>
    </nav>
    <div id="menu" class="menu" hidden>
      <button id="menu-close" aria-label="Close menu">✕</button>
      <div id="menu-body"></div>
    </div>
    <div id="hero" class="unit thin">
      <div class="who"></div><div class="bar"><i class="fill"></i><span class="hpt"></span></div>
      <div class="slots" aria-label="Armor slots"></div><div class="stats"></div>
    </div>
    <div id="board"></div>
    <div id="arena" hidden>
      <div class="plates">
      <div id="foe" class="unit foe">
        <div class="who"></div><div class="bar"><i class="fill"></i><span class="hpt"></span></div>
        <div class="slots" aria-label="Enemy armor slots"></div><div class="stats"></div>
      </div>
      </div>
      <div class="stage">
        <div class="wall"></div><div class="floor"></div>
        <div class="torch l"></div><div class="torch r"></div>
        <div id="fig-hero" class="fig hero"></div>
        <div id="dice"><div class="die"><b id="hd">–</b><small id="hd-sub">You</small></div><span class="vs">vs</span><div class="die foe-die"><b id="fd">–</b><small id="fd-sub">Enemy</small></div></div>
        <div id="fig-foe" class="fig foe-fig"></div>
      </div>
    </div>
    <div id="actions" hidden>
      <button data-act="attack" data-key="1">1 · Attack</button>
      <button data-act="defend" data-key="2">2 · Defend</button>
      <button data-act="repair" data-key="3">3 · Repair</button>
      <button data-act="item" data-key="4" disabled title="No items yet">4 · Use item</button>
      <button data-act="flee" data-key="5">5 · Flee</button>
    </div>
    <pre id="log" aria-live="polite"></pre>
    <div id="move">
      <button id="roll-move" class="big">Roll to move</button>
      <div class="die move-die"><b id="move-die">–</b></div>
      <span id="steps"></span>
    </div>
    <p class="hint">Roll 1 + d10 to move. In a room, tap a glowing doorway or use the arrow keys to choose a way.</p>
  </section>

  <section id="end" class="screen" hidden>
    <h1 id="end-title"></h1><p id="end-text"></p>
    <pre id="end-log"></pre>
    <button id="again" class="big">Play again</button>
  </section>
</main>
<script src="data.js"></script>
<script src="mapgen.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
